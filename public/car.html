<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Motion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; color: #fff; }

    #safety-modal {
      position: fixed; inset: 0; z-index: 1000;
      background: #0b0c10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .badge-sec { background: #1f2026; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #f59e0b; margin-bottom: 16px; font-weight: 700; }
    h1 { font-size: 26px; margin-bottom: 10px; font-weight: 800; }
    p.desc { color: #94a3b8; font-size: 14px; max-width: 480px; line-height: 1.5; margin-bottom: 24px; }
    
    .btn-passenger { background: #10b981; color: #000; border: none; padding: 14px 28px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-passenger:active { transform: scale(0.97); }

    #player-container {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 10;
      display: flex; align-items: center; justify-content: center; background: #050505;
    }
    #player-container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }

    /* HUD de diagnóstico en vivo */
    #hud-status {
      position: absolute; top: 14px; left: 14px; z-index: 300;
      background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;
      padding: 10px 14px; border-radius: 8px; font-size: 11px; line-height: 1.5;
    }
    .hud-ok { color: #34d399; font-weight: bold; }
    .hud-err { color: #f87171; font-weight: bold; }

    #nav-controls {
      position: absolute; bottom: 20px; right: 20px; z-index: 300; display: flex; gap: 10px;
    }
    .ctrl-btn {
      background: #1e293b; color: #fff; border: 1px solid #475569; padding: 12px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .ctrl-btn:active { background: #334155; }

    #side-drawer {
      position: absolute; top: 0; right: 0; width: 380px; height: 100vh;
      background: rgba(18, 18, 22, 0.98); backdrop-filter: blur(20px);
      z-index: 400; border-left: 1px solid #334155;
      display: flex; flex-direction: column; padding: 20px;
      transform: translateX(100%); transition: transform 0.3s ease;
    }
    #side-drawer.open { transform: translateX(0); }
    .channel-card {
      background: #151821; border: 1px solid #252b3b; padding: 14px; border-radius: 10px; cursor: pointer; margin-bottom: 10px;
    }
    .channel-card:active { border-color: #10b981; }
  </style>
  <script src="/player-assets/ogv.js"></script>
</head>
<body>

  <div id="safety-modal">
    <div class="badge-sec">MOTOR WEBGL / WASM</div>
    <h1>Modo Pasajero Continuo</h1>
    <p class="desc">
      El reproductor decodificará por software directamente sobre el lienzo gráfico.
    </p>
    <button class="btn-passenger" onclick="startApp()">INICIAR REPRODUCCIÓN</button>
  </div>

  <div id="player-container"></div>

  <!-- HUD Informativo -->
  <div id="hud-status">
    <div>WASM: <span id="st-wasm">Comprobando...</span></div>
    <div>Demuxer WebM: <span id="st-webm">Comprobando...</span></div>
    <div>Estado: <span id="st-player" class="hud-ok">Esperando inicio</span></div>
  </div>

  <div id="nav-controls">
    <button class="ctrl-btn" onclick="toggleDrawer()">📺 Seleccionar Video</button>
    <button class="ctrl-btn" onclick="toggleMute()">Audio On/Off</button>
  </div>

  <div id="side-drawer">
    <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
      <h3>Fuentes Disponibles</h3>
      <button onclick="toggleDrawer()" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div id="channelList"></div>
  </div>

  <script>
    let ogvPlayer = null;
    let audioCtx = null;

    async function checkDiagnostics() {
      document.getElementById('st-wasm').textContent = typeof WebAssembly !== 'undefined' ? 'DISPONIBLE' : 'NO SOPORTADO';
      document.getElementById('st-wasm').className = typeof WebAssembly !== 'undefined' ? 'hud-ok' : 'hud-err';

      try {
        const r = await fetch('/api/diagnostics/player');
        const data = await r.json();
        const hasWebm = data.hasWebmDemuxer;
        document.getElementById('st-webm').textContent = hasWebm ? 'INSTALADO' : 'FALTANTE (Usar OGG)';
        document.getElementById('st-webm').className = hasWebm ? 'hud-ok' : 'hud-err';
      } catch(e) {}
    }

    function startApp() {
      document.getElementById('safety-modal').style.display = 'none';

      // Reactivar canal de audio
      try {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) {
          audioCtx = new AudioClass();
          audioCtx.resume();
        }
      } catch(e) {}

      initEngine();
      loadChannels();
    }

    function initEngine() {
      const container = document.getElementById('player-container');
      container.innerHTML = '';

      ogvPlayer = new window.OGVPlayer({
        base: '/player-assets',
        webGL: true,
        worker: true
      });

      ogvPlayer.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
      container.appendChild(ogvPlayer);

      ogvPlayer.addEventListener('loadstart', () => updateStatus('Conectando flujo...', 'hud-ok'));
      ogvPlayer.addEventListener('loadedmetadata', () => updateStatus('Transmitiendo fotogramas', 'hud-ok'));
      ogvPlayer.addEventListener('error', (e) => updateStatus('Error de decodificación OGV', 'hud-err'));
      
      // Prevención de pausa en marcha
      ogvPlayer.addEventListener('pause', () => {
        if (!ogvPlayer.ended) {
          setTimeout(() => { if (ogvPlayer) ogvPlayer.play().catch(()=>{}); }, 100);
        }
      });
    }

    function updateStatus(txt, cls) {
      const el = document.getElementById('st-player');
      el.textContent = txt;
      el.className = cls;
    }

    function loadChannels() {
      fetch('/api/iptv/data')
        .then(r => r.json())
        .then(data => {
          const channels = data.channels || [];
          document.getElementById('channelList').innerHTML = channels.map(c => `
            <div class="channel-card" onclick="playSource('${c.url}', '${c.name}')">
              <div style="font-weight:700; font-size:13px;">${c.name}</div>
              <div style="font-size:10px; color:#94a3b8; margin-top:4px;">Tocar para cargar</div>
            </div>
          `).join('');

          // Sintonizar automáticamente la prueba OGG nativa
          if (channels.length > 0) {
            playSource(channels[0].url, channels[0].name);
          }
        });
    }

    function playSource(url, name) {
      updateStatus('Cargando: ' + name, 'hud-ok');
      toggleDrawer(false);

      const proxyUrl = `/api/proxy-stream?url=${encodeURIComponent(url)}`;
      ogvPlayer.src = proxyUrl;
      ogvPlayer.load();
      ogvPlayer.play().catch(e => updateStatus('Fallo al iniciar buffer', 'hud-err'));
    }

    function toggleMute() {
      if (ogvPlayer) ogvPlayer.muted = !ogvPlayer.muted;
    }

    function toggleDrawer(force) {
      const el = document.getElementById('side-drawer');
      el.classList.toggle('open', force);
    }

    window.addEventListener('DOMContentLoaded', checkDiagnostics);
  </script>
</body>
</html>
