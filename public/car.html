<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Motion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; color: #fff; }

    #overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #0b0c0e; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .badge { background: #1c1d22; border: 1px solid #2e3038; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #aaa; margin-bottom: 14px; }
    h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px; }
    p { color: #888; font-size: 14px; margin-bottom: 24px; max-width: 440px; line-height: 1.4; }

    .btn-auth {
      background: #e82127; color: #fff; border: none; padding: 16px 36px;
      font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(232, 33, 39, 0.4);
    }
    .btn-auth:active { transform: scale(0.98); }

    #player-mount {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 10;
    }
    #player-mount canvas {
      width: 100vw !important; height: 100vh !important; object-fit: contain;
    }

    #nav-bar {
      position: absolute; bottom: 24px; right: 24px; z-index: 150;
      display: flex; gap: 12px;
    }
    .nav-action-btn {
      background: rgba(24, 24, 28, 0.9); color: #fff; border: 1px solid #333;
      padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 600;
      cursor: pointer; backdrop-filter: blur(10px);
    }

    #side-drawer {
      position: absolute; top: 0; right: 0; width: 440px; height: 100vh;
      background: rgba(18, 18, 22, 0.98); backdrop-filter: blur(20px);
      z-index: 200; border-left: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column; padding: 24px;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #side-drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .close-btn { background: #28282e; border: none; color: #fff; width: 34px; height: 34px; border-radius: 17px; cursor: pointer; }

    .channel-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .channel-card {
      background: #1c1c20; border: 1px solid #28282e; padding: 14px; border-radius: 10px; cursor: pointer;
    }
    .channel-card:active { border-color: #e82127; }
    .channel-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .channel-sub { font-size: 11px; color: #888; }

    #status-pill {
      position: absolute; top: 16px; left: 20px; z-index: 300;
      background: rgba(20, 20, 24, 0.9); padding: 8px 16px; border-radius: 8px;
      font-size: 13px; border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
  </style>
  <script src="/player-assets/ogv.js"></script>
</head>
<body>

  <div id="overlay">
    <div class="badge">SISTEMA TESLA MOTION</div>
    <h1>Paso 1: Pon el vehículo en Drive (D)</h1>
    <p>Pasa primero a Drive (D) y luego pulsa el botón para activar el reproductor por software y el canal de audio.</p>
    <button class="btn-auth" onclick="unlockHub()">YA ESTOY EN DRIVE • INICIAR</button>
  </div>

  <div id="player-mount"></div>

  <div id="nav-bar">
    <button class="nav-action-btn" onclick="toggleDrawer()">📺 Canales</button>
  </div>

  <div id="side-drawer">
    <div class="drawer-header">
      <h3>Canales de Transmisión</h3>
      <button class="close-btn" onclick="toggleDrawer()">✕</button>
    </div>
    <div class="channel-list" id="channelListContainer"></div>
  </div>

  <div id="status-pill">Listo</div>

  <script>
    let playerInstance = null;
    let userAuthorized = false;
    let audioContextShared = null;

    const overlay = document.getElementById('overlay');
    const playerMount = document.getElementById('player-mount');
    const sideDrawer = document.getElementById('side-drawer');
    const statusPill = document.getElementById('status-pill');
    const channelListContainer = document.getElementById('channelListContainer');

    function showStatus(msg) {
      statusPill.textContent = msg;
      statusPill.style.opacity = '1';
      setTimeout(() => { statusPill.style.opacity = '0'; }, 3000);
    }

    // Inicialización del motor idéntico a MotionStream
    function initEngine() {
      if (playerInstance) {
        try { playerInstance.stop(); } catch(e){}
        playerMount.innerHTML = '';
      }

      // Desbloquear canal de audio en el navegador de Tesla
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContextShared = new AudioCtx();
          audioContextShared.resume();
        }
      } catch(e){}

      playerInstance = new window.OGVPlayer({
        base: '/player-assets',
        wasm: true,
        webGL: true
      });

      playerInstance.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
      playerMount.appendChild(playerInstance);

      // Si el carro intenta pausar el video en movimiento, forzar play
      playerInstance.addEventListener('pause', () => {
        if (userAuthorized && !playerInstance.ended) {
          setTimeout(() => {
            if (userAuthorized && playerInstance) playerInstance.play();
          }, 100);
        }
      });
    }

    function unlockHub() {
      overlay.style.display = 'none';
      userAuthorized = true;
      initEngine();
      loadChannels();
    }

    function loadChannels() {
      fetch('/api/iptv/data')
        .then(r => r.json())
        .then(data => {
          const channels = data.channels || [];
          channelListContainer.innerHTML = channels.map(c => `
            <div class="channel-card" onclick="tuneChannel('${encodeURIComponent(c.url)}', '${c.name.replace(/'/g, "")}')">
              <div class="channel-name">${c.name}</div>
              <div class="channel-sub">Tocar para sintonizar en ruta</div>
            </div>
          `).join('');

          // Sintonizar automáticamente el primer canal a través del proxy
          if (channels.length > 0) {
            tuneChannel(encodeURIComponent(channels[0].url), channels[0].name);
          }
        }).catch(() => {
          showStatus('Error cargando canales');
        });
    }

    function tuneChannel(encodedUrl, name) {
      showStatus('Sintonizando: ' + name);
      sideDrawer.classList.remove('open');

      if (!playerInstance) initEngine();

      // Enrutar siempre por el proxy para eliminar bloqueos CORS de Tesla
      const proxyUrl = `/api/proxy-stream?url=${encodedUrl}`;
      playerInstance.src = proxyUrl;
      playerInstance.load();
      playerInstance.play();
    }

    function toggleDrawer() {
      sideDrawer.classList.toggle('open');
    }
  </script>
</body>
</html>
