<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Motion All-in-One</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html {
      width: 100vw; height: 100vh; overflow: hidden; background: #000; color: #fff;
      -webkit-user-select: none; user-select: none;
    }
    
    #overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #0f0f11; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .badge { background: #222; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #aaa; margin-bottom: 14px; }
    h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px; }
    p { color: #888; font-size: 14px; margin-bottom: 24px; max-width: 440px; line-height: 1.4; }
    
    .room-box { background: #1c1c1e; border: 1px solid #2c2c2e; padding: 12px 28px; border-radius: 12px; margin-bottom: 24px; }
    .room-box span { font-size: 11px; color: #888; display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
    .room-box strong { font-size: 32px; letter-spacing: 4px; color: #e82127; }
    
    .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }
    .btn-primary {
      background: #e82127; color: #fff; border: none; padding: 16px;
      font-size: 15px; font-weight: 700; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(232, 33, 39, 0.4); text-decoration: none; display: block;
    }

    /* Blindaje de contenedor: dimensiones fijas y aceleración por GPU */
    #yt-wrapper {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 10;
      transform: translateZ(0); will-change: transform;
      pointer-events: auto;
    }
    
    #status-pill {
      position: absolute; top: 16px; left: 20px; z-index: 50;
      background: rgba(15, 15, 17, 0.85); padding: 8px 16px; border-radius: 8px;
      font-size: 13px; border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #toggle-menu-btn {
      position: absolute; bottom: 24px; right: 24px; z-index: 60;
      background: rgba(232, 33, 39, 0.9); color: #fff; border: none;
      padding: 14px 20px; border-radius: 30px; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px;
    }
    #toggle-menu-btn:active { transform: scale(0.96); }

    #side-drawer {
      position: absolute; top: 0; right: 0; width: 420px; height: 100vh;
      background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(20px);
      z-index: 70; border-left: 1px solid rgba(255,255,255,0.12);
      display: flex; flex-direction: column; padding: 20px;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #side-drawer.open { transform: translateX(0); }

    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .drawer-header h3 { font-size: 18px; font-weight: 700; }
    .close-btn { background: #2c2c2e; border: none; color: #fff; width: 32px; height: 32px; border-radius: 16px; font-weight: 700; cursor: pointer; }

    .search-box { display: flex; gap: 8px; margin-bottom: 8px; }
    .search-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 14px; }
    .search-box button { background: #e82127; border: none; color: #fff; padding: 12px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    #suggest-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .suggest-chip { background: #242426; border: 1px solid #333; color: #ccc; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; text-align: left; }
    .suggest-chip:active { background: #e82127; color: #fff; }

    .drawer-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .item-card { display: flex; gap: 10px; background: #242426; border: 1px solid #333; padding: 8px; border-radius: 8px; align-items: center; cursor: pointer; }
    .item-card:active { border-color: #e82127; }
    .item-card img { width: 80px; height: 50px; border-radius: 4px; object-fit: cover; }
    .item-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .drawer-footer { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ctrl-btn { background: #242426; border: 1px solid #333; color: #fff; padding: 12px 0; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .ctrl-btn:active { background: #333; }
  </style>
</head>
<body>

  <!-- Audio puente silencioso para registrar la sesión multimedia con el sistema del auto -->
  <audio id="keepAliveAudio" loop playsinline preload="auto">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
  </audio>

  <div id="overlay">
    <div class="badge">SISTEMA INTEGRADO TESLA MOTION</div>
    <h1>Pantalla Continua en Ruta</h1>
    <p>Activa la sesión prioritaria de audio y video para evitar pausas al cambiar de marcha.</p>
    
    <div class="room-box">
      <span>Código de Enlace</span>
      <strong id="display-room">TSLA-77</strong>
    </div>

    <div class="btn-container">
      <button class="btn-primary" onclick="startDisplay()">SOY PASAJERO - ACTIVAR MODO CONTINUO</button>
    </div>
  </div>

  <div id="status-pill">Iniciando...</div>

  <div id="yt-wrapper">
    <div id="player"></div>
  </div>

  <button id="toggle-menu-btn" onclick="toggleDrawer()">
    <span>🔍</span> Controles y Búsqueda
  </button>

  <div id="side-drawer">
    <div class="drawer-header">
      <h3>Menú Multimedia</h3>
      <button class="close-btn" onclick="toggleDrawer()">✕</button>
    </div>

    <div class="search-box">
      <input type="text" id="drawerSearchInput" placeholder="Buscar vídeo o tema..." autocomplete="off" oninput="handleDrawerSuggest(this.value)" onkeydown="if(event.key==='Enter') executeDrawerSearch(this.value)">
      <button onclick="executeDrawerSearch(document.getElementById('drawerSearchInput').value)">Buscar</button>
    </div>

    <div id="suggest-list"></div>

    <div class="drawer-results" id="drawerResults">
      <div style="font-size: 12px; color: #888; text-align: center; margin-top: 20px;">
        Selecciona un contenido para reproducir.
      </div>
    </div>

    <div class="drawer-footer">
      <button class="ctrl-btn" onclick="emitCommand('seek', { seconds: -10 })">-10s</button>
      <button class="ctrl-btn" onclick="emitCommand('play')">Play</button>
      <button class="ctrl-btn" onclick="emitCommand('seek', { seconds: 10 })">+10s</button>
      <button class="ctrl-btn" style="grid-column: span 3; background: #2c2c2e;" onclick="emitCommand('pause')">Pausar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const ROOM_ID = 'TSLA-77';
    let ytPlayer;
    let suggestDebounce = null;
    let userPaused = false;
    let keeperTimer = null;
    const statusPill = document.getElementById('status-pill');
    const drawer = document.getElementById('side-drawer');
    const keepAliveAudio = document.getElementById('keepAliveAudio');
    const socket = io();

    // 1. Blindaje contra los eventos de pérdida de foco del sistema al pasar a Drive
    window.addEventListener('blur', (e) => {
      e.stopImmediatePropagation();
    }, true);

    document.addEventListener('visibilitychange', (e) => {
      if (document.hidden) {
        e.stopImmediatePropagation();
        // Si el auto oculta temporalmente el contexto de primer plano, reactivamos
        if (ytPlayer && !userPaused && ytPlayer.playVideo) {
          ytPlayer.playVideo();
        }
      }
    }, true);

    function showStatus(msg) {
      statusPill.textContent = msg;
      statusPill.style.opacity = '1';
      setTimeout(() => { statusPill.style.opacity = '0'; }, 3000);
    }

    function toggleDrawer() {
      drawer.classList.toggle('open');
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '5qap5aO4i9A',
        playerVars: {
          'autoplay': 1,
          'controls': 1,
          'playsinline': 1,
          'rel': 0,
          'disablekb': 1,
          'modestbranding': 1,
          'fs': 0
        },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function setupMediaSession() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Tesla Motion Stream',
          artist: 'Copiloto Activo',
          album: 'Pantalla Continua'
        });

        navigator.mediaSession.playbackState = 'playing';

        navigator.mediaSession.setActionHandler('play', () => {
          userPaused = false;
          if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
        });

        navigator.mediaSession.setActionHandler('pause', () => {
          userPaused = true;
          if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
        });
      }
    }

    function onPlayerStateChange(event) {
      // Si entra en pausa pero el usuario NO la ordenó (evento provocado al meter Drive)
      if (event.data === YT.PlayerState.PAUSED && !userPaused) {
        if (ytPlayer && ytPlayer.playVideo) {
          ytPlayer.playVideo();
        }
      }
      if (event.data === YT.PlayerState.PLAYING) {
        if ('mediaSession' in navigator) {
          navigator.mediaSession.playbackState = 'playing';
        }
      }
    }

    function startDisplay() {
      document.getElementById('overlay').style.display = 'none';
      socket.emit('join-room', ROOM_ID);
      userPaused = false;

      // Iniciar el canal de audio continuo para mantener el foco del subsistema de Tesla
      keepAliveAudio.play().catch(() => {});
      setupMediaSession();

      if (ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
      }

      // Verificación en bucle cada 250ms para recuperación inmediata sin bache
      clearInterval(keeperTimer);
      keeperTimer = setInterval(() => {
        if (ytPlayer && ytPlayer.getPlayerState && !userPaused) {
          const state = ytPlayer.getPlayerState();
          if (state === YT.PlayerState.PAUSED || state === 2) {
            ytPlayer.playVideo();
          }
        }
      }, 250);

      showStatus('Modo Continuo Listo');
    }

    function playYtVideo(videoId) {
      userPaused = false;
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
      }
      showStatus('Cargando señal...');
    }

    function handleDrawerSuggest(val) {
      clearTimeout(suggestDebounce);
      const query = val.trim();
      const list = document.getElementById('suggest-list');
      if (query.length < 2) { list.innerHTML = ''; return; }

      suggestDebounce = setTimeout(async () => {
        try {
          const res = await fetch(`/api/suggest?q=${encodeURIComponent(query)}`);
          const data = await res.json();
          const items = data.suggestions || [];
          if (items.length === 0) { list.innerHTML = ''; return; }

          list.innerHTML = items.slice(0, 4).map(s => `
            <div class="suggest-chip" onclick="selectDrawerSuggest('${s.replace(/'/g, "\\'")}')">🔍 ${s}</div>
          `).join('');
        } catch (e) {
          list.innerHTML = '';
        }
      }, 200);
    }

    function selectDrawerSuggest(term) {
      document.getElementById('drawerSearchInput').value = term;
      document.getElementById('suggest-list').innerHTML = '';
      executeDrawerSearch(term);
    }

    async function executeDrawerSearch(q) {
      const query = q.trim();
      if (!query) return;
      document.getElementById('suggest-list').innerHTML = '';
      const container = document.getElementById('drawerResults');
      container.innerHTML = '<div style="color:#888; text-align:center; padding:15px; font-size:13px;">Buscando...</div>';

      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (!data.results || data.results.length === 0) {
          container.innerHTML = '<div style="color:#888; text-align:center; padding:15px; font-size:13px;">Sin resultados</div>';
          return;
        }

        container.innerHTML = '';
        data.results.forEach(v => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.onclick = () => {
            playYtVideo(v.videoId);
            emitCommand('playVideo', { videoId: v.videoId });
            toggleDrawer();
          };
          card.innerHTML = `
            <img src="${v.thumbnail}" alt="thumb">
            <div style="overflow:hidden;">
              <div class="item-title">${v.title}</div>
              <div style="font-size:11px; color:#888; margin-top:2px;">${v.author}</div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (e) {
        container.innerHTML = '<div style="color:#e82127; text-align:center; padding:15px; font-size:13px;">Error en la búsqueda</div>';
      }
    }

    function emitCommand(action, payload = {}) {
      if (action === 'pause') userPaused = true;
      if (action === 'play') userPaused = false;
      socket.emit('send-command', { roomId: ROOM_ID, action, payload });
    }

    socket.on('execute-command', ({ action, payload }) => {
      if (action === 'playVideo') playYtVideo(payload.videoId);
      else if (action === 'pause') {
        userPaused = true;
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      } else if (action === 'play') {
        userPaused = false;
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      } else if (action === 'seek' && ytPlayer) {
        const cur = ytPlayer.getCurrentTime();
        ytPlayer.seekTo(cur + payload.seconds, true);
      }
    });
  </script>
</body>
</html>
