<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Motion - Decoupled Stream</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; color: #fff; }
    
    #overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #0f0f11; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .badge { background: #222; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #aaa; margin-bottom: 14px; }
    h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px; }
    p { color: #888; font-size: 14px; margin-bottom: 24px; max-width: 440px; line-height: 1.4; }
    
    .room-box { background: #1c1c1e; border: 1px solid #2c2c2e; padding: 12px 28px; border-radius: 12px; margin-bottom: 24px; }
    .room-box span { font-size: 11px; color: #888; display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
    .room-box strong { font-size: 32px; letter-spacing: 4px; color: #e82127; }
    
    .btn-primary {
      background: #e82127; color: #fff; border: none; padding: 16px 32px;
      font-size: 15px; font-weight: 700; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(232, 33, 39, 0.4); text-decoration: none; display: block;
    }

    /* Video desacoplado fuera de vista */
    #hidden-video {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }

    /* Canvas acelerado visible */
    #render-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
      z-index: 10;
    }
    
    #status-pill {
      position: absolute; top: 16px; left: 20px; z-index: 50;
      background: rgba(15, 15, 17, 0.85); padding: 8px 16px; border-radius: 8px;
      font-size: 13px; border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #toggle-menu-btn {
      position: absolute; bottom: 24px; right: 24px; z-index: 60;
      background: rgba(232, 33, 39, 0.9); color: #fff; border: none;
      padding: 14px 20px; border-radius: 30px; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px); display: flex; align-items: center; gap: 8px;
    }
    #toggle-menu-btn:active { transform: scale(0.96); }

    #side-drawer {
      position: absolute; top: 0; right: 0; width: 420px; height: 100vh;
      background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(20px);
      z-index: 70; border-left: 1px solid rgba(255,255,255,0.12);
      display: flex; flex-direction: column; padding: 20px;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #side-drawer.open { transform: translateX(0); }

    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .drawer-header h3 { font-size: 18px; font-weight: 700; }
    .close-btn { background: #2c2c2e; border: none; color: #fff; width: 32px; height: 32px; border-radius: 16px; font-weight: 700; cursor: pointer; }

    .search-box { display: flex; gap: 8px; margin-bottom: 8px; }
    .search-box input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 14px; }
    .search-box button { background: #e82127; border: none; color: #fff; padding: 12px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    .drawer-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .item-card { display: flex; gap: 10px; background: #242426; border: 1px solid #333; padding: 8px; border-radius: 8px; align-items: center; cursor: pointer; }
    .item-card:active { border-color: #e82127; }
    .item-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .drawer-footer { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ctrl-btn { background: #242426; border: 1px solid #333; color: #fff; padding: 12px 0; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .ctrl-btn:active { background: #333; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <div id="overlay">
    <div class="badge">SISTEMA INTEGRADO TESLA MOTION</div>
    <h1>Modo Desacoplado de Ruta</h1>
    <p>Renderizado por Canvas acelerado para evitar la suspensión gráfica de Chromium al rodar.</p>
    
    <div class="room-box">
      <span>Código de Enlace</span>
      <strong id="display-room">TSLA-77</strong>
    </div>

    <button class="btn-primary" onclick="startDisplay()">SOY PASAJERO O ESTACIONADO</button>
  </div>

  <div id="status-pill">Iniciando...</div>

  <video id="hidden-video" playsinline webkit-playsinline crossOrigin="anonymous" preload="auto"></video>
  <canvas id="render-canvas"></canvas>

  <button id="toggle-menu-btn" onclick="toggleDrawer()">
    <span>🔍</span> Canales / Búsqueda
  </button>

  <div id="side-drawer">
    <div class="drawer-header">
      <h3>Canales y Medios</h3>
      <button class="close-btn" onclick="toggleDrawer()">✕</button>
    </div>

    <div class="search-box">
      <input type="text" id="streamUrlInput" placeholder="Pega URL .m3u8 o busca..." autocomplete="off">
      <button onclick="loadDirectUrl(document.getElementById('streamUrlInput').value)">Cargar</button>
    </div>

    <div class="drawer-results" id="drawerResults">
      <div class="item-card" onclick="playPreset('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'Canal Prueba HLS')">
        <div style="padding:10px;">
          <div class="item-title">Transmisión de Prueba HLS (Big Buck Bunny)</div>
          <div style="font-size:11px; color:#888;">Flujo HLS directo continuo</div>
        </div>
      </div>
    </div>

    <div class="drawer-footer">
      <button class="ctrl-btn" onclick="video.currentTime -= 10">-10s</button>
      <button class="ctrl-btn" onclick="forcePlay()">Play</button>
      <button class="ctrl-btn" onclick="video.currentTime += 10">+10s</button>
      <button class="ctrl-btn" style="grid-column: span 3; background: #2c2c2e;" onclick="video.pause()">Pausar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const ROOM_ID = 'TSLA-77';
    const video = document.getElementById('hidden-video');
    const canvas = document.getElementById('render-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const drawer = document.getElementById('side-drawer');
    const statusPill = document.getElementById('status-pill');
    let hls = null;
    let renderLoopActive = false;
    let userAuthorized = false;

    const socket = io();

    function showStatus(msg) {
      statusPill.textContent = msg;
      statusPill.style.opacity = '1';
      setTimeout(() => { statusPill.style.opacity = '0'; }, 3000);
    }

    function toggleDrawer() {
      drawer.classList.toggle('open');
    }

    function renderPipeline() {
      if (!renderLoopActive) return;

      if (video.readyState >= 2 && !video.paused && !video.ended) {
        if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
          }
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }

      if ('requestVideoFrameCallback' in video) {
        video.requestVideoFrameCallback(renderPipeline);
      } else {
        requestAnimationFrame(renderPipeline);
      }
    }

    function startDisplay() {
      document.getElementById('overlay').style.display = 'none';
      userAuthorized = true;
      socket.emit('join-room', ROOM_ID);

      renderLoopActive = true;
      if ('requestVideoFrameCallback' in video) {
        video.requestVideoFrameCallback(renderPipeline);
      } else {
        requestAnimationFrame(renderPipeline);
      }

      playPreset('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'Canal de Prueba Activo');
      showStatus('Modo Desacoplado Listo');
    }

    function playPreset(url, title) {
      showStatus('Sintonizando: ' + title);
      loadStream(url);
    }

    function loadDirectUrl(url) {
      if (!url || !url.trim()) return;
      loadStream(url.trim());
      toggleDrawer();
    }

    function loadStream(url) {
      if (Hls.isSupported() && url.includes('.m3u8')) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          forcePlay();
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            showStatus('Error de transmisión HLS');
          }
        });
      } else {
        video.src = url;
        video.load();
        forcePlay();
      }
    }

    function forcePlay() {
      const p = video.play();
      if (p !== undefined) {
        p.catch(() => {
          video.muted = true;
          video.play().then(() => {
            video.muted = false;
          });
        });
      }
    }

    video.addEventListener('pause', () => {
      if (userAuthorized && !video.ended) {
        setTimeout(() => {
          if (userAuthorized) forcePlay();
        }, 150);
      }
    });

    socket.on('execute-command', ({ action, payload }) => {
      if (action === 'playStream') loadStream(payload.url);
      else if (action === 'pause') { userAuthorized = false; video.pause(); }
      else if (action === 'play') { userAuthorized = true; forcePlay(); }
    });
  </script>
</body>
</html>
