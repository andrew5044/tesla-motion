<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Motion Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; }
    
    #overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #0f0f11; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .badge { background: #222; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #aaa; margin-bottom: 12px; }
    h1 { font-size: 28px; margin-bottom: 8px; font-weight: 600; }
    p { color: #888; font-size: 15px; margin-bottom: 24px; max-width: 450px; }
    .room-box { background: #1c1c1e; border: 1px solid #2c2c2e; padding: 14px 28px; border-radius: 12px; margin-bottom: 28px; }
    .room-box span { font-size: 13px; color: #888; display: block; margin-bottom: 4px; text-transform: uppercase; }
    .room-box strong { font-size: 32px; letter-spacing: 4px; color: #e82127; }
    .start-btn {
      background: #e82127; color: #fff; border: none; padding: 16px 36px;
      font-size: 18px; font-weight: 700; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(232, 33, 39, 0.4);
    }

    /* Contenedores de reproducción */
    #yt-wrapper, #hls-wrapper {
      position: absolute; inset: 0; width: 100vw; height: 100vh;
    }
    #iptv-video {
      width: 100%; height: 100%; object-fit: contain; background: #000;
    }
    .hidden { display: none !important; }
    
    /* Indicador sutil de canal o video activo */
    #channel-tag {
      position: absolute; top: 18px; left: 24px; z-index: 50;
      background: rgba(0,0,0,0.65); padding: 8px 16px; border-radius: 8px;
      font-size: 14px; border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="badge">SISTEMA MULTIMEDIA COPILOTO</div>
    <h1>Conectar Pantalla Tesla</h1>
    <p>Toca para autorizar la pantalla y desbloquear el audio del vehículo.</p>
    
    <div class="room-box">
      <span>Código de Enlace</span>
      <strong id="display-room">TSLA-77</strong>
    </div>

    <button class="start-btn" onclick="startVehicleDisplay()">ACTIVAR PANTALLA Y AUDIO</button>
  </div>

  <div id="channel-tag">Cargando...</div>

  <!-- Reproductor YouTube -->
  <div id="yt-wrapper">
    <div id="player"></div>
  </div>

  <!-- Reproductor IPTV / HLS -->
  <div id="hls-wrapper" class="hidden">
    <video id="iptv-video" playsinline></video>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const ROOM_ID = 'TSLA-77';
    let ytPlayer;
    let hls = null;
    const iptvVideo = document.getElementById('iptv-video');
    const ytWrapper = document.getElementById('yt-wrapper');
    const hlsWrapper = document.getElementById('hls-wrapper');
    const channelTag = document.getElementById('channel-tag');
    const socket = io();

    function showTag(text) {
      channelTag.textContent = text;
      channelTag.style.opacity = '1';
      setTimeout(() => { channelTag.style.opacity = '0'; }, 3500);
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '5qap5aO4i9A',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'playsinline': 1,
          'rel': 0,
          'disablekb': 1,
          'iv_load_policy': 3
        }
      });
    }

    function startVehicleDisplay() {
      document.getElementById('overlay').style.display = 'none';
      socket.emit('join-room', ROOM_ID);
      if (ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
      }
      showTag('Sistema Listo');
    }

    // Modo IPTV
    function playIptvStream(url, name = 'Canal IPTV') {
      // Pausar YouTube y ocultarlo
      if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      ytWrapper.classList.add('hidden');
      hlsWrapper.classList.remove('hidden');

      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(iptvVideo);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          iptvVideo.play().catch(e => console.log('Autoplay blocked:', e));
        });
      } else if (iptvVideo.canPlayType('application/vnd.apple.mpegurl')) {
        iptvVideo.src = url;
        iptvVideo.play();
      }
      showTag(`En Vivo: ${name}`);
    }

    // Modo YouTube
    function playYtVideo(videoId) {
      // Pausar IPTV y ocultarlo
      if (hls) {
        iptvVideo.pause();
        hls.destroy();
        hls = null;
      }
      hlsWrapper.classList.add('hidden');
      ytWrapper.classList.remove('hidden');
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
      }
      showTag('Reproduciendo YouTube');
    }

    // Recepción de órdenes desde el móvil
    socket.on('execute-command', ({ action, payload }) => {
      if (action === 'playVideo') {
        playYtVideo(payload.videoId);
      } else if (action === 'playIptv') {
        playIptvStream(payload.url, payload.name);
      } else if (action === 'pause') {
        if (!hlsWrapper.classList.contains('hidden')) iptvVideo.pause();
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      } else if (action === 'play') {
        if (!hlsWrapper.classList.contains('hidden')) iptvVideo.play();
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      } else if (action === 'seek') {
        if (ytPlayer && ytWrapper && !ytWrapper.classList.contains('hidden')) {
          const currentTime = ytPlayer.getCurrentTime();
          ytPlayer.seekTo(currentTime + payload.seconds, true);
        }
      }
    });
  </script>
</body>
</html>
