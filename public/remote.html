<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control Copiloto Tesla</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121214; color: #fff; padding: 18px; display: flex; flex-direction: column; min-height: 100vh; }
    
    .header { text-align: center; margin-bottom: 16px; }
    .header h2 { font-size: 20px; font-weight: 600; }
    .header p { color: #888; font-size: 13px; margin-top: 2px; }
    
    .tabs { display: flex; background: #1c1c1e; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #888; font-weight: 600; font-size: 14px; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: #2c2c2e; color: #fff; }

    .card { background: #1c1c1e; padding: 16px; border-radius: 14px; margin-bottom: 16px; border: 1px solid #2a2a2c; position: relative; }
    label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 8px; }
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; position: relative; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 14px; }
    .btn-action { background: #e82127; color: #fff; border: none; padding: 12px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }

    /* Desplegable de autocompletado */
    .suggestions-dropdown {
      position: absolute; top: calc(100% - 2px); left: 0; right: 0;
      background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 8px;
      z-index: 100; max-height: 220px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: none;
    }
    .suggestion-item {
      padding: 12px 14px; font-size: 14px; color: #ddd; border-bottom: 1px solid #28282a;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: #2c2c2e; color: #fff; }

    /* Resultados YouTube */
    .results-container { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; margin-top: 10px; }
    .video-card { display: flex; gap: 12px; background: #242426; border: 1px solid #333; padding: 8px; border-radius: 10px; align-items: center; cursor: pointer; }
    .video-card:active { border-color: #e82127; background: #2a2a2c; }
    .video-thumb { width: 90px; height: 55px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
    .video-info { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
    .video-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .video-meta { font-size: 11px; color: #888; margin-top: 4px; }

    /* Canales Rápidos En Vivo */
    .live-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 6px; }
    .live-card { background: #242426; border: 1px solid #333; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; }
    .live-card:active { border-color: #e82127; background: #2c2c2e; }
    .live-card strong { display: block; font-size: 14px; margin-bottom: 4px; color: #fff; }
    .live-card span { font-size: 11px; color: #e82127; font-weight: 700; text-transform: uppercase; }

    /* Controles */
    .controls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ctrl-btn { background: #242426; border: 1px solid #333; color: #fff; padding: 14px 0; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .ctrl-btn:active { background: #333; }
    .btn-full { grid-column: span 3; background: #2c2c2e; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Control Copiloto Tesla</h2>
    <p>Sala: <strong style="color: #e82127;">TSLA-77</strong></p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-yt-btn" onclick="switchTab('yt')">Buscador YouTube</button>
    <button class="tab-btn" id="tab-live-btn" onclick="switchTab('live')">TV En Vivo 24/7</button>
  </div>

  <!-- Pestaña Buscador -->
  <div id="section-yt">
    <div class="card">
      <label>Buscar vídeos o música</label>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Escribe canción, artista o tema..." autocomplete="off" oninput="onSearchInput(this.value)" onkeydown="if(event.key==='Enter') executeSearch(this.value)">
        <button class="btn-action" onclick="executeSearch(document.getElementById('searchInput').value)">Buscar</button>
        <div class="suggestions-dropdown" id="suggestionsBox"></div>
      </div>
      <div id="loadingText" style="display:none; font-size:13px; color:#888; text-align:center; padding:10px;">Buscando vídeos...</div>
      <div class="results-container" id="resultsContainer"></div>
    </div>

    <div class="card">
      <label>Enviar enlace directo de YouTube</label>
      <div class="search-row">
        <input type="text" id="ytUrl" placeholder="https://youtu.be/...">
        <button class="btn-action" onclick="sendDirectUrl()">Enviar</button>
      </div>
    </div>
  </div>

  <!-- Pestaña TV en Vivo 24/7 (Garantizados sin bloqueo) -->
  <div id="section-live" class="hidden">
    <div class="card">
      <label>Canales de Transmisión Directa</label>
      <div class="live-grid">
        <div class="live-card" onclick="playLiveChannel('noticias caracol en vivo')">
          <strong>Noticias Caracol</strong>
          <span>🔴 En Directo</span>
        </div>
        <div class="live-card" onclick="playLiveChannel('noticias rcn en vivo')">
          <strong>Noticias RCN</strong>
          <span>🔴 En Directo</span>
        </div>
        <div class="live-card" onclick="playLiveChannel('redmas noticias en vivo')">
          <strong>Red+ Noticias</strong>
          <span>🔴 En Directo</span>
        </div>
        <div class="live-card" onclick="playLiveChannel('dw espanol en vivo')">
          <strong>DW Español</strong>
          <span>🔴 En Directo</span>
        </div>
        <div class="live-card" onclick="playLiveChannel('musica lofi hip hop live')">
          <strong>Lofi Chill Beats</strong>
          <span>🎵 Música 24/7</span>
        </div>
        <div class="live-card" onclick="playLiveChannel('musica electronica live 2026')">
          <strong>Club Dance Live</strong>
          <span>🎵 Música 24/7</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Controles universales -->
  <div class="card">
    <label>Controles de Reproducción</label>
    <div class="controls-grid">
      <button class="ctrl-btn" onclick="sendCommand('seek', { seconds: -10 })">-10s</button>
      <button class="ctrl-btn" onclick="sendCommand('play')">Play</button>
      <button class="ctrl-btn" onclick="sendCommand('seek', { seconds: 10 })">+10s</button>
      <button class="ctrl-btn btn-full" onclick="sendCommand('pause')">Pausar Reproducción</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const ROOM_ID = 'TSLA-77';
    let suggestTimeout = null;

    socket.emit('join-room', ROOM_ID);

    function onSearchInput(val) {
      clearTimeout(suggestTimeout);
      const box = document.getElementById('suggestionsBox');
      const text = val.trim();

      if (text.length < 2) {
        box.style.display = 'none';
        return;
      }

      suggestTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`/api/suggest?q=${encodeURIComponent(text)}`);
          const data = await res.json();
          const items = data.suggestions || [];
          if (items.length === 0) { box.style.display = 'none'; return; }

          box.innerHTML = items.slice(0, 7).map(term => `
            <div class="suggestion-item" onclick="selectSuggestion('${term.replace(/'/g, "\\'")}')">
              <span>🔍 ${term}</span>
            </div>
          `).join('');
          box.style.display = 'block';
        } catch (e) {
          box.style.display = 'none';
        }
      }, 250);
    }

    function selectSuggestion(term) {
      document.getElementById('searchInput').value = term;
      document.getElementById('suggestionsBox').style.display = 'none';
      executeSearch(term);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-row')) {
        document.getElementById('suggestionsBox').style.display = 'none';
      }
    });

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Motion Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    
    #overlay {

    h1 { font-size: 26px; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.5px; }
    p { color: #888; font-size: 14px; margin-bottom: 24px; max-width: 420px; line-height: 1.4; }
    
    .room-box { background: #1c1c1e; border: 1px solid #2c2c2e; padding: 12px 28px; border-radius: 12px; margin-bottom: 24px; }
    .room-box span { font-size: 11px; color: #888; display: block; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
    .room-box strong { font-size: 32px; letter-spacing: 4px; color: #e82127; }
    
    .btn-container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }

      font-size: 15px; font-weight: 700; border-radius: 12px; cursor: pointer;
      box-shadow: 0 4px 18px rgba(232, 33, 39, 0.4); text-decoration: none; display: block;
    }
    .btn-secondary {
      background: #1c1c1e; color: #ddd; border: 1px solid #333; padding: 14px;
      font-size: 14px; font-weight: 600; border-radius: 12px; cursor: pointer; text-decoration: none; display: block;
    }

    #yt-wrapper {
      position: absolute; inset: 0; width: 100vw; height: 100vh;
    }
    
    #status-pill {

      font-size: 13px; border: 1px solid rgba(255,255,255,0.12);

<body>

  <div id="overlay">
    <div class="badge">SISTEMA MULTIMEDIA COPILOTO</div>
    <h1>Pantalla Tesla Motion</h1>
    <p>Toca para autorizar la pantalla y desbloquear el audio del vehículo.</p>
    
    <div class="room-box">
      <span>Código de Enlace</span>
      <strong id="display-room">TSLA-77</strong>
    </div>

    <div class="btn-container">
      <button class="btn-primary" onclick="startDisplay()">1. ACTIVAR PANTALLA Y AUDIO</button>
      <a class="btn-secondary" id="theater-trigger" href="#">2. PANTALLA COMPLETA (TEATRO)</a>
    </div>
  </div>

  <div id="status-pill">Iniciando...</div>

  <div id="yt-wrapper">
    <div id="player"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const ROOM_ID = 'TSLA-77';
    let ytPlayer;
    const statusPill = document.getElementById('status-pill');
    const socket = io();

    const destinationUrl = encodeURIComponent(window.location.origin + '/car');
    document.getElementById('theater-trigger').href = `https://www.youtube.com/redirect?q=${destinationUrl}`;

    function showStatus(msg) {
      statusPill.textContent = msg;
      statusPill.style.opacity = '1';
      setTimeout(() => { statusPill.style.opacity = '0'; }, 3000);
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '5qap5aO4i9A',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'playsinline': 1,
          'rel': 0,
          'disablekb': 1,
          'iv_load_policy': 3
        }
      });
    }

    function startDisplay() {
      document.getElementById('overlay').style.display = 'none';
      socket.emit('join-room', ROOM_ID);
      if (ytPlayer && ytPlayer.playVideo) {
        ytPlayer.playVideo();
      }
      showStatus('Pantalla y Audio Conectados');
    }

    function playYtVideo(videoId) {
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(videoId);
      }
      showStatus('Reproduciendo señal...');
    }

    socket.on('execute-command', ({ action, payload }) => {
      if (action === 'playVideo') playYtVideo(payload.videoId);
      else if (action === 'pause') {
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      } else if (action === 'play') {
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      } else if (action === 'seek') {
        if (ytPlayer) {
          const currentTime = ytPlayer.getCurrentTime();
          ytPlayer.seekTo(currentTime + payload.seconds, true);
        }
      }
    });
  </script>
</body>
