<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Motion — Control Pasajero</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:#0b0c10; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:20px; }
    .card { background:#151821; border:1px solid #252b3b; border-radius:16px; padding:24px; width:100%; max-width:360px; text-align:center; }
    h2 { font-size:20px; margin-bottom:12px; }
    input { width:100%; padding:14px; background:#07080a; border:1px solid #334155; border-radius:10px; color:#fff; font-size:20px; text-align:center; margin-bottom:14px; letter-spacing:6px; font-weight:800; }
    button { width:100%; padding:14px; background:#10b981; border:none; border-radius:10px; color:#000; font-weight:800; cursor:pointer; }
    button:active { transform: scale(0.98); }
    .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
    .btn-sec { background:#1e293b; color:#fff; }
    #remote-ui { display:none; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- Emparejamiento -->
  <div class="card" id="pair-ui">
    <h2>Emparejar Control</h2>
    <p style="color:#64748b; font-size:12px; margin-bottom:16px;">Ingresa el PIN de 4 dígitos que aparece en la pantalla del vehículo</p>
    <input type="text" id="inputPin" maxlength="4" placeholder="0000" inputmode="numeric">
    <button onclick="pairDevice()">Vincular</button>
  </div>

  <!-- Controles Multimedia -->
  <div class="card" id="remote-ui">
    <h2>Control Pasajero</h2>
    <div style="font-size:11px; color:#10b981; margin-bottom:16px; font-weight:700;">● Terminal Vinculada</div>
    
    <div class="btn-grid">
      <button class="btn-sec" onclick="sendCommand('play')">▶ Reanudar</button>
      <button class="btn-sec" onclick="sendCommand('pause')">⏸ Pausar</button>
      <button class="btn-sec" onclick="sendCommand('seek', { time: 0 })">⏮ Reiniciar</button>
      <button class="btn-sec" onclick="changeDemo()">📺 Canal Demo</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentPin = '';

    function pairDevice() {
      const pin = document.getElementById('inputPin').value.trim();
      if (pin.length !== 4) return alert('El PIN debe tener 4 dígitos');
      currentPin = pin;
      socket.emit('pair-remote', { pin });
    }

    socket.on('pair-success', ({ isPassenger }) => {
      if (!isPassenger) {
        alert('El vehículo se encuentra en Modo Conductor. Los controles multimedia están deshabilitados.');
        return;
      }
      document.getElementById('pair-ui').style.display = 'none';
      document.getElementById('remote-ui').style.display = 'block';
    });

    socket.on('pair-error', ({ message }) => {
      alert('Error de emparejamiento: ' + message);
    });

    socket.on('player-disconnected', () => {
      alert('La pantalla del vehículo se ha desconectado.');
      location.reload();
    });

    function sendCommand(action, payload = {}) {
      socket.emit('player-command', { pin: currentPin, action, payload });
    }

    function changeDemo() {
      sendCommand('changeChannel', {
        url: 'https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c0/Big_Buck_Bunny_4K.webm/Big_Buck_Bunny_4K.webm.360p.vp9.webm',
        name: 'Big Buck Bunny (WebM)'
      });
    }
  </script>
</body>
</html>
