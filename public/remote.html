<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla Motion · Control remoto</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#fff;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px;max-width:720px;margin:auto}.brand{font-size:24px;font-weight:850;margin:8px 0 4px}.brand b{color:#e82127}.muted{color:#9699a3;font-size:14px}.card{background:#191a20;border:1px solid #30323a;border-radius:15px;padding:17px;margin-top:17px}label{display:block;color:#a5a7af;font-size:12px;text-transform:uppercase;font-weight:700;margin-bottom:9px}input{width:100%;background:#090a0d;color:white;border:1px solid #383a43;border-radius:10px;padding:14px;font-size:18px;letter-spacing:2px}button{border:0;border-radius:10px;padding:13px 16px;background:#292b32;color:white;font-weight:700;font-size:15px}button.red{background:#e82127}.row{display:flex;gap:9px}.row>*{flex:1}.search{display:flex;gap:8px}.search input{font-size:16px;letter-spacing:0;min-width:0}.list{display:flex;flex-direction:column;gap:9px;margin-top:12px}.item{display:flex;gap:10px;align-items:center;background:#24262d;padding:10px;border-radius:10px}.item img{width:92px;height:54px;object-fit:cover;border-radius:6px}.item div{flex:1;min-width:0}.item strong{font-size:14px;display:block}.item small{color:#9a9da6}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.controls button:last-child{grid-column:1/-1}.status{padding-top:10px;color:#aaa;font-size:13px}.note{font-size:12px;color:#858994;line-height:1.5;margin-top:16px}
</style></head><body><div class="brand">TESLA <b>MOTION</b></div><div class="muted">Control remoto desde tu celular</div>
<section class="card"><label for="room">Código que aparece en la pantalla del Tesla</label><div class="row"><input id="room" maxlength="6" placeholder="ABC123" autocomplete="one-time-code"><button class="red" id="connect">Vincular</button></div><div class="status" id="status">Ingresa el código mostrado en Tesla Motion.</div></section>
<section class="card"><label>Buscar contenido</label><div class="search"><input id="query" placeholder="Artista, canción o video"><button class="red" id="search">Buscar</button></div><div class="list" id="results"></div></section>
<section class="card"><label>Controles de reproducción</label><div class="controls"><button id="back">−10 segundos</button><button id="play" class="red">▶ Reproducir</button><button id="forward">+10 segundos</button><button id="pause">Ⅱ Pausar</button></div></section>
<div class="note">El control remoto permite buscar y enviar contenido al reproductor. Respeta siempre las restricciones de seguridad del vehículo; no utilices el teléfono mientras conduces.</div>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);const socket=io();let code='';
socket.on('connect',()=>{$('status').textContent='Conectado al servidor. Ingresa el código del Tesla.'});
socket.on('room-joined',d=>{$('status').textContent='Vinculado a la sesión '+d.code;});
socket.on('room-error',m=>$('status').textContent=m);
function send(action,payload={}){if(!code){$('status').textContent='Primero vincula el control con el Tesla.';return}socket.emit('send-command',{roomId:code,action,payload})}
$('connect').onclick=()=>{code=$('room').value.trim().toUpperCase();if(!/^[A-F0-9]{6}$/.test(code)){code='';$('status').textContent='El código debe tener seis caracteres.';return}socket.emit('join-room',code)};
async function search(){const q=$('query').value.trim();if(!q)return;$('results').textContent='Buscando…';try{const d=await(await fetch('/api/search?q='+encodeURIComponent(q))).json();$('results').replaceChildren();(d.results||[]).forEach(v=>{const row=document.createElement('div');row.className='item';const img=document.createElement('img');img.src=v.thumbnail||'';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=v.title;const meta=document.createElement('small');meta.textContent=v.author+' · '+v.duration;info.append(title,meta);const btn=document.createElement('button');btn.className='red';btn.textContent='Enviar';btn.onclick=()=>send('playVideo',{videoId:v.videoId,title:v.title});row.append(img,info,btn);$('results').append(row)});if(!(d.results||[]).length)$('results').textContent='Sin resultados.'}catch(e){$('results').textContent='No se pudo completar la búsqueda.'}}
$('search').onclick=search;$('query').onkeydown=e=>{if(e.key==='Enter')search()};$('play').onclick=()=>send('play');$('pause').onclick=()=>send('pause');$('back').onclick=()=>send('seek',{seconds:-10});$('forward').onclick=()=>send('seek',{seconds:10});
</script></body></html>
